<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: {{PRIMARY_COLOR}};
    --ink: #f6f0e5;
    --muted: rgba(246, 240, 229, 0.62);
    --line: rgba(246, 240, 229, 0.16);
    --dark: #11110f;
  }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--dark);
    color: var(--ink);
    font-family: "Avenir Next", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
  }
  .page {
    width: 100%;
    height: 100%;
    padding: 78px 120px 58px;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: grid;
    grid-template-columns: 660px 1fr;
    gap: 68px;
    align-items: end;
    padding-bottom: 42px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  h2 {
    font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
    font-size: 82px;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  .summary {
    font-size: 32px;
    line-height: 1.45;
    color: var(--muted);
    font-weight: 600;
    max-width: 850px;
  }
  .pipeline {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    margin-top: 58px;
    border: 1px solid var(--line);
    background: var(--line);
  }
  .stage {
    background: var(--dark);
    padding: 56px 50px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 520px;
    position: relative;
  }
  .stage.highlight {
    background: #1d1713;
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  .stage-num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 116px;
    line-height: 0.86;
    color: rgba(246,240,229,0.16);
  }
  .highlight .stage-num {
    color: var(--accent);
  }
  .stage-title {
    margin-top: 44px;
    font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
    font-size: 58px;
    line-height: 1.04;
    letter-spacing: -0.025em;
  }
  .stage-items {
    list-style: none;
    margin-top: 30px;
  }
  .stage-items li {
    font-size: 29px;
    line-height: 1.42;
    color: var(--muted);
    font-weight: 600;
    max-width: 440px;
  }
  .stage-items li + li {
    margin-top: 14px;
  }
  .stage-badge {
    align-self: flex-start;
    border: 1px solid rgba(246,240,229,0.18);
    color: var(--accent);
    padding: 13px 18px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .arrow {
    display: none;
  }
  .footer {
    margin-top: 34px;
    display: flex;
    justify-content: space-between;
    color: rgba(246,240,229,0.42);
    font-size: 22px;
    font-weight: 700;
  }
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <div>
      <div class="eyebrow">How it works</div>
      <h2>从项目，到作品</h2>
    </div>
    <p class="summary">先理解项目为什么存在，再设计它应该如何被看见，最后交付一份能直接展示的 README。</p>
  </header>
  <section class="pipeline">
    {{PIPELINE_STAGES}}
  </section>
  <footer class="footer">
    <span>{{STAGE_COUNT}} focused steps</span>
    <span>Story first · Visual second · Details last</span>
  </footer>
</main>
</body>
</html>
